<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">

    <h:form id="frmRegistro" styleClass="lit-form" enctype="multipart/form-data">
        <p:inputText id="nombre" value="#{clienteUI.nombreCompleto}" placeholder="Nombre del cliente"
                     maxlength="300" styleClass="lit-input lit-ancho"/>

        <div class="lit-fila">
            <p:inputText id="telefono" value="#{clienteUI.cliente.telefono}" placeholder="Teléfono"
                         maxlength="20" styleClass="lit-input"/>
            <p:inputText id="correo" type="email" value="#{clienteUI.cliente.correo}"
                         placeholder="Correo electrónico" maxlength="150" styleClass="lit-input"/>
        </div>

        <h:panelGroup id="pnlConstancia" layout="block" styleClass="lit-constancia">
            <p:fileUpload listener="#{clienteUI.subirConstanciaFiscal}"
                          mode="simple" skinSimple="true" auto="true"
                          label="#{empty clienteUI.nombreConstancia ? 'Constancia Fiscal (PDF)' : clienteUI.nombreConstancia}"
                          chooseIcon="pi pi-file-arrow-up"
                          accept=".pdf,application/pdf" allowTypes="/(\.|\/)(pdf)$/" sizeLimit="5242880"
                          invalidFileMessage="El campo de constancia fiscal solo debe de permitir archivos en PDF"
                          invalidSizeMessage="La constancia fiscal no debe pesar mas de 5 MB"
                          process="@this" update="pnlConstancia :msgs"/>
        </h:panelGroup>

        <div class="lit-acciones">
            <p:commandButton value="Registrar" action="#{clienteUI.registrarCliente}"
                             process="@this nombre telefono correo" update="@form :msgs" styleClass="lit-boton"/>
            <p:commandButton value="Limpiar formulario" action="#{clienteUI.limpiarRegistro}"
                             process="@this" update="@form" styleClass="lit-boton lit-boton-chico">
                <p:resetInput target="@form"/>
            </p:commandButton>
        </div>
    </h:form>
</ui:composition>
