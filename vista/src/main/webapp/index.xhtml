<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/templates/plantilla.xhtml">

    <ui:define name="contenido">
        <h:panelGroup id="contenido" layout="block">

            <h:form id="frmMenu" rendered="#{navegacionUI.enMenu}">
                <nav class="menu-tarjetas">

                    <p:commandLink action="#{navegacionUI.ir('registrar')}" process="@this"

                            <svg viewBox="0 0 100 80" aria-hidden="true">
                                <circle cx="42" cy="26" r="14"/>
                                <path d="M17 64c0-15 11-22 25-22s25 7 25 22v3c0 2-1 3-3 3H20c-2 0-3-1-3-3z"/>
                                <g transform="rotate(-45 74 58)">
                                    <rect x="62" y="52" width="26" height="12" rx="1.5" class="contorno"/>
                                    <path d="M62 52l-9 6 9 6z" class="contorno"/>
                                </g>
                            </svg>
                        </span>
                        <span class="tarjeta-texto">REGISTRAR CLIENTE</span>
                    </p:commandLink>

                    <a class="tarjeta" href="#" title="Disponible próximamente" onclick="return false;">
                        <span class="tarjeta-icono">
                            <svg viewBox="0 0 100 80" aria-hidden="true">
                                <circle cx="40" cy="26" r="14"/>
                                <path d="M15 64c0-15 11-22 25-22s25 7 25 22v3c0 2-1 3-3 3H18c-2 0-3-1-3-3z"/>
                                <rect x="60" y="38" width="24" height="31" rx="3" class="contorno"/>
                                <rect x="66" y="35" width="12" height="6" rx="1.5" class="contorno"/>
                                <g class="hueco">
                                    <rect x="64" y="46" width="3" height="3"/><rect x="69" y="46" width="11" height="3"/>
                                    <rect x="64" y="52" width="3" height="3"/><rect x="69" y="52" width="11" height="3"/>
                                    <rect x="64" y="58" width="3" height="3"/><rect x="69" y="58" width="11" height="3"/>
                                </g>
                            </svg>
                        </span>
                        <span class="tarjeta-texto">CONSULTAR CLIENTE</span>
                    </a>

                    <a class="tarjeta" href="#" title="Disponible próximamente" onclick="return false;">
                        <span class="tarjeta-icono">
                            <svg viewBox="0 0 100 80" aria-hidden="true">
                                <circle cx="48" cy="28" r="14"/>
                                <path d="M23 64c0-15 11-22 25-22s25 7 25 22v3c0 2-1 3-3 3H26c-2 0-3-1-3-3z"/>
                                <g transform="rotate(-18 58 18)">

                                    <rect x="51" y="13" width="9" height="8" rx="1" class="hueco"/>
                                </g>
                            </svg>
                        </span>
                        <span class="tarjeta-texto">ELIMINAR CLIENTE</span>
                    </a>

                    <p:commandLink action="#{navegacionUI.ir('modificar')}" process="@this"
                                   update=":contenido :titulo :frmRegresar" styleClass="tarjeta">
                        <span class="tarjeta-icono">
                            <svg viewBox="0 0 100 80" aria-hidden="true">
                                <circle cx="54" cy="26" r="14"/>
                                <path d="M29 64c0-15 11-22 25-22s25 7 25 22v3c0 2-1 3-3 3H32c-2 0-3-1-3-3z"/>
                                <g transform="rotate(45 34 60)">
                                    <rect x="20" y="55" width="26" height="10" rx="2" class="contorno"/>
                                    <path d="M46 55l8 5-8 5z" class="contorno"/>
                                </g>
                                <rect x="40" y="71" width="14" height="2.5" rx="1"/>
                            </svg>
                        </span>
                        <span class="tarjeta-texto">MODIFICAR CLIENTE</span>
                    </p:commandLink>
                </nav>

                <nav class="menu-tarjetas menu-proveedores">

                    <p:commandLink action="#{navegacionUI.ir('registrar-proveedor')}" process="@this"
                                   update=":contenido :titulo :frmRegresar" styleClass="tarjeta">
                        <span class="tarjeta-icono">
                            <svg viewBox="0 0 100 80" aria-hidden="true">
                                <circle cx="42" cy="26" r="14"/>
                                <path d="M17 64c0-15 11-22 25-22s25 7 25 22v3c0 2-1 3-3 3H20c-2 0-3-1-3-3z"/>
                                <path d="M26 24c0-9 7-15 16-15s16 6 16 15z"/>
                                <rect x="23" y="22" width="38" height="4" rx="2"/>
                                <g transform="rotate(-45 74 58)">
                                    <rect x="62" y="52" width="26" height="12" rx="1.5" class="contorno"/>
                                    <path d="M62 52l-9 6 9 6z" class="contorno"/>
                                </g>
                            </svg>
                        </span>
                        <span class="tarjeta-texto">REGISTRAR PROVEEDOR</span>

                    <p:commandLink action="#{navegacionUI.ir('consulta-proveedor')}"
                                   process="@this"
                                   update=":contenido :titulo :frmRegresar"
                                   styleClass="tarjeta">
                        <span class="tarjeta-icono">
                            <svg viewBox="0 0 100 80" aria-hidden="true">
                                <circle cx="40" cy="26" r="14"/>
                                <path d="M15 64c0-15 11-22 25-22s25 7 25 22v3c0 2-1 3-3 3H18c-2 0-3-1-3-3z"/>
                                <path d="M24 24c0-9 7-15 16-15s16 6 16 15z"/>
                                <rect x="21" y="22" width="38" height="4" rx="2"/>
                                <rect x="60" y="38" width="24" height="31" rx="3" class="contorno"/>
                                <rect x="66" y="35" width="12" height="6" rx="1.5" class="contorno"/>
                                <g class="hueco">
                                    <rect x="64" y="46" width="3" height="3"/>
                                    <rect x="69" y="46" width="11" height="3"/>
                                    <rect x="64" y="52" width="3" height="3"/>
                                    <rect x="69" y="52" width="11" height="3"/>
                                    <rect x="64" y="58" width="3" height="3"/>
                                    <rect x="69" y="58" width="11" height="3"/>

                            </svg>
                        </span>

                        <span class="tarjeta-texto">CONSULTAR PROVEEDOR</span>
                    </p:commandLink>

                    <p:commandLink action="#{navegacionUI.ir('eliminar-proveedor')}"
                                   process="@this"
                                   update=":contenido :titulo :frmRegresar"
                                   styleClass="tarjeta">
                        <span class="tarjeta-icono">
                            <svg viewBox="0 0 100 80" aria-hidden="true">
                                <circle cx="48" cy="28" r="14"/>
                                <path d="M23 64c0-15 11-22 25-22s25 7 25 22v3c0 2-1 3-3 3H26c-2 0-3-1-3-3z"/>
                                <path d="M32 26c0-9 7-15 16-15s16 6 16 15z"/>
                                <rect x="29" y="24" width="38" height="4" rx="2"/>
                            </svg>
                        </span>
                        <span class="tarjeta-texto">ELIMINAR PROVEEDOR</span>
                    </p:commandLink>

                    <a class="tarjeta" href="#" title="Disponible próximamente" onclick="return false;">
                        <span class="tarjeta-icono">
                            <svg viewBox="0 0 100 80" aria-hidden="true">
                                <circle cx="54" cy="26" r="14"/>
                                <path d="M29 64c0-15 11-22 25-22s25 7 25 22v3c0 2-1 3-3 3H32c-2 0-3-1-3-3z"/>
                                <path d="M38 24c0-9 7-15 16-15s16 6 16 15z"/>
                                <rect x="35" y="22" width="38" height="4" rx="2"/>
                                <g transform="rotate(45 34 60)">
                                    <rect x="20" y="55" width="26" height="10" rx="2" class="contorno"/>
                                    <path d="M46 55l8 5-8 5z" class="contorno"/>
                                </g>
                                <rect x="40" y="71" width="14" height="2.5" rx="1"/>
                            </svg>
                        </span>
                        <span class="tarjeta-texto">MODIFICAR PROVEEDOR</span>
                    </a>
                </nav>

            </h:form>

            <h:panelGroup layout="block" rendered="#{navegacionUI.pagina eq 'registrar'}">
                <ui:include src="/WEB-INF/clientes/registrar.xhtml"/>
            </h:panelGroup>

            <h:panelGroup layout="block" rendered="#{navegacionUI.pagina eq 'modificar'}">
                <ui:include src="/WEB-INF/clientes/modificar.xhtml"/>
            </h:panelGroup>

            <h:panelGroup layout="block" rendered="#{navegacionUI.pagina eq 'registrar-proveedor'}">
                <ui:include src="/WEB-INF/proveedores/registrar.xhtml"/>
            </h:panelGroup>

            <h:panelGroup layout="block"
                          rendered="#{navegacionUI.pagina eq 'consulta-proveedor'}">
                <ui:include src="/WEB-INF/proveedores/consulta.xhtml"/>
            </h:panelGroup>

            <h:panelGroup layout="block"
                          rendered="#{navegacionUI.pagina eq 'eliminar-proveedor'}">
                <ui:include src="/WEB-INF/proveedores/eliminar.xhtml"/>
            </h:panelGroup>
        </h:panelGroup>
    </ui:define>
</ui:composition>
